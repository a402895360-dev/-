<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>训练计划</title>
<style>
  :root{
    --bg:#0f1420; --card:#1a2233; --card2:#212b40; --text:#e8ecf4; --muted:#8b95a9;
    --accent:#4f8cff; --green:#34c77b; --orange:#f5a623; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
  header{padding:24px 16px 8px;text-align:center}
  header h1{font-size:23px}
  header p{color:var(--muted);margin-top:4px;font-size:13px}
  .week-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid #1c2540}
  .wk-btn{border:1px solid #2c3750;background:var(--card);color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;font-size:13px;transition:.15s}
  .wk-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:bold}
  .day-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 12px}
  .day-btn{border:1px solid #2c3750;background:var(--card);color:var(--muted);padding:8px 15px;border-radius:999px;cursor:pointer;font-size:13.5px;transition:.15s}
  .day-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold}
  .day-btn.rest-day{opacity:.75}
  .pullup-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:9px 8px;background:var(--card);border:1px solid #232e47;border-radius:12px;margin-bottom:10px}
  .pullup-btn{border:1px solid #2c3750;background:var(--card2);color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer;font-size:12px;transition:.15s}
  .pullup-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold}
  .up-summary{margin-top:5px;font-size:12px;color:#e8c98a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up-box{background:#141d2c;border:1px dashed #33466b;border-radius:10px;padding:12px 14px;margin-top:12px}
  .up-title{font-size:14px;font-weight:bold;color:#e8c98a;margin-bottom:6px}
  .up-phase{font-size:11px;color:var(--muted);font-weight:normal}
  .up-note{font-size:12.5px;color:#c3cde0;line-height:1.7;margin-top:7px}
  .info-wrap{max-width:720px;margin:6px auto;padding:0 14px}
  details.info{background:#161d2e;border:1px solid #263252;border-radius:12px;margin-bottom:8px;overflow:hidden}
  details.info summary{cursor:pointer;padding:12px 15px;font-size:14px;font-weight:bold;color:#9db6e8;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
  details.info summary::before{content:"▸";transition:.2s;font-size:12px;color:var(--muted)}
  details.info[open] summary::before{transform:rotate(90deg)}
  .info-body{padding:0 15px 14px;font-size:13.5px;line-height:1.8;color:#c3cde0;border-top:1px solid #22304f;padding-top:12px}
  .info-body b{color:var(--orange)}
  main{max-width:720px;margin:0 auto;padding:8px 14px}
  .day-title{text-align:center;margin:14px 0 16px}
  .day-title h2{font-size:21px}
  .day-title span{color:var(--muted);font-size:13px;display:block;margin-top:4px}
  .phase-tag{display:inline-block;margin-top:8px;background:#33406a;color:#9db6e8;font-size:12px;padding:4px 12px;border-radius:999px}
  .section-label{margin:18px 0 10px;font-size:14px;font-weight:bold;color:var(--accent);letter-spacing:1px}
  .exercise{background:var(--card);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;border:1px solid #232e47}
  .ex-head{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;user-select:none}
  .ex-head:hover{background:var(--card2)}
  .done-toggle{width:24px;height:24px;border-radius:50%;border:2px solid #3a4869;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;cursor:pointer;transition:.15s}
  .done .done-toggle{background:var(--green);border-color:var(--green);color:#fff}
  .done .ex-name{text-decoration:line-through;color:var(--muted)}
  .ex-info{flex:1}
  .ex-name{font-size:15.5px;font-weight:bold;line-height:1.35}
  .ex-meta{color:var(--muted);font-size:12.5px;margin-top:3px}
  .badge{display:inline-block;background:#28355a;color:#93ade0;font-size:11px;padding:2px 7px;border-radius:5px;margin-right:4px;margin-top:4px}
  .badge.db{background:#4a3a20;color:#e8c98a}
  .ex-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
  .ex-body.open{max-height:900px}
  .steps{padding:0 16px 16px;border-top:1px solid #24304d;padding-top:14px}
  .target-muscle{font-size:13px;color:var(--accent);margin-bottom:8px}
  .step{display:flex;gap:10px;margin-bottom:9px;line-height:1.65;font-size:14px;color:#d3dae8}
  .step b{color:var(--accent);flex-shrink:0;font-size:12px;padding-top:2px}
  .tip{background:#24304d;border-left:3px solid var(--orange);padding:9px 12px;border-radius:0 8px 8px 0;font-size:13px;color:#c9bfa8;margin-top:12px;line-height:1.6}
  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 0 18px;line-height:1.8}
  .progress-wrap{max-width:720px;margin:0 auto;padding:0 14px}
  .progress-track{height:8px;background:#232e47;border-radius:4px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));width:0%;transition:.3s}
  .progress-label{text-align:center;color:var(--muted);font-size:12.5px;margin-top:6px;margin-bottom:10px}
  .mark-all-btn{display:block;margin:0 auto 14px;padding:10px 24px;background:var(--green);color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:bold;cursor:pointer;transition:.15s}
  .mark-all-btn:hover{opacity:.85}
  .mark-all-btn:active{transform:scale(.97)}
  
  .date-row{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 14px;font-size:13.5px;color:var(--muted)}
  .date-row input[type=date]{background:var(--card);border:1px solid #2c3750;border-radius:8px;color:var(--text);padding:5px 10px;font-size:13px;outline:none}
  .date-row input[type=date]:focus{border-color:var(--accent)}
  .date-row .clear-btn{background:none;border:1px solid #2c3750;border-radius:8px;color:var(--muted);padding:5px 12px;cursor:pointer;font-size:12.5px}
  .date-row .clear-btn:hover{border-color:var(--orange);color:var(--orange)}
  </style>
</head>
<body>
<header>
  <h1>💪 训练计划</h1>
  <p id="today"></p>
</header>

<div class="week-bar" id="weekBar"></div>
<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
  <div class="progress-label" id="plabel"></div>
  <button class="mark-all-btn" onclick="markAllToday()">✓ 一键打卡今日全部</button>
</div>

<div class="info-wrap" id="infoWrap"></div>

<nav class="day-bar" id="dayBar"></nav>
<main id="main"></main>
<footer>数据保存在本机浏览器 · 点击动作展开做法 · 点圆圈打卡<br>打卡按「第几周 × 训练日」分别记录，切换周数互不影响</footer>

<script>

// key = 本地视频文件名（不含.mp4）

 '弹力带站姿夹胸':'band-chest-fly','夹胸':'band-chest-fly',
 '冲肩俯卧撑':'pike-pushup','折刀俯卧撑':'pike-pushup',
 '弹力带侧平举':'band-lateral-raise',

 '仰卧反向划船':'inverted-row','单臂哑铃划船':'db-row',

 '左右摸墙':'russian-twist','负重转体卷腹':'weighted-twist','俄罗斯转体':'russian-twist',

function findVideo(name){
 if(!name)return null;
 // 精确匹配优先
 if(name in VIDEOS)return VIDEOS[name];
 // 关键词包含匹配（长关键词优先避免误配）
 const keys=Object.keys(VIDEOS).sort((a,b)=>b.length-a.length);
 for(const k of keys){if(k&&name.indexOf(k)!==-1)return VIDEOS[k];}
 return null;
}function phaseInfo(w){
  if(w===4)return{tag:"第4周 · 过渡周",mode:"w4",desc:"组数不变，每组次数执行下限（写8~12就做8），多留余力（剩2~3次力气停手），休息用上限"};
  if(w<=8)return{tag:`第${w}周 · 弹力带期`,mode:"band",desc:w<=6?"正常次数范围，留1~2次余力":"推进次数/阻力；若弹力带3×15轻松且余力超2次可提前引入哑铃"};
  if(w<=12)return{tag:`第${w}周 · 哑铃过渡期`,mode:"db",desc:"每2周换1~2个动作为哑铃版，换完从3×10~12重新起步"};
  return{tag:`第${w}周 · 哑铃塑形期`,mode:"db",desc:"哑铃为主，弹力带只保留面拉、夹胸"};
}

/* ================= 动作数据 ================= */

 {name:"小幅开合扩胸",sets:"30 秒",part:["胸","肩前侧"],steps:["站姿收腹沉肩，双臂身前合拢","向两侧水平打开至肩高，反复循环"],tip:"预激活神经募集。"},

function pullWarmup(){return[
 {sec:"热身 & 预激活"},

  <b>减量触发（出现任一就减）：</b>主要动作连续 2 次次数/重量下降；晨起体重连续 1~2 周下降或睡眠变差/没精神；肩/肘持续不适。减量顺序：先砍高位下拉 → 再减反向划船 → 引体最后动。<br><br>
  <b>加量方向：</b>4~8 周后恢复良好且表现持续上涨时，加量优先给 Legs；核心进入负重后减组数提质量（徒手 → 负重 → 增重）。`},
 {t:"〇 版本说明与恢复优先原则",html:`
  <b>循环：</b>训练日1 Pull → 日2 Push → 日3 Legs+核心 → 日4 休息 → 日5 Pull → 日6 Push → 日7 休息，固定不轮换。<br><br>
  <b>第4周 = 过渡周：</b>本周切换V2结构（胸/背/肩一周2次），组数不变，但每组次数执行<b>下限</b>（写8~12就做8），每组多留余力（剩2~3次力气停手），休息时间用上限。让身体先适应频率翻倍，第5周起恢复正常范围。<br><br>
  <b>恢复优先铁律：</b>连续2周出现体重下降、睡眠变差、没精神、某部位酸到下次还没恢复——不是加动作而是减动作。<br><br>
  <b>通用铁律（每天）：</b>慢放2秒·发力1秒·顶峰停顿0.5秒；不耸肩不塌腰不甩动不憋气；变形立即停组。余力解释：能做15个的标准动作，剩1次余力=做14个停。<br><br>
  <b>俯卧撑升级：</b>跪姿轻松4×15 → 第1组标准做到不动跪姿补满 → 全标准。冲肩→折刀逐步升级不急。<br><br>
  <b>核心脖子代偿：</b>下巴轻收不压胸、头与躯干一致、肩胛离地即可。调整后仍酸就改 Dead Bug / 反向卷腹 / 平板，不要硬坚持。<br><br>
  <b>薄肌理念：</b>肌肉增大取决于训练刺激+总量+渐进超负荷+热量摄入+时间。你57kg偏轻，优先把体重健康涨到60→62→64kg，几组侧平举不会变厚重健美体型。<br><br>
  <b>哑铃时机：</b>不必被第9周锁死——弹力带已3×15轻松且余力明显超2次，可提前增阻力或引入哑铃。`},
 {t:"五 核心频率小结（每周约18组维持不变）",html:`
  训练日1（Pull）：上腹3组 + 下腹2组 = 5组<br>
  训练日3：正向摸墙2 + 胯下击掌2 + 左右摸墙2 + 侧平板左右各2 = 8组<br>
  训练日5（Pull）：左右摸墙3 + 侧平板左右各2 = 5组<br><br>
  合计约18组核心/周，目标腹部线条+鲨鱼线+腰部稳定，不是耐力比赛，此量维持不变。<br>
  Dead Bug 在训练日 1/3/5 热身内固定做（只激活不计入训练量）；Pull 日另加悬垂 1 组 × 20 秒作引体专项热身。`},
 {t:"七 换哑铃时间表（汇总）",html:`
  <b>第4周</b> 过渡周：本版结构+次数按下限、留2~3次余力、休息用上限<br>
  <b>第5周</b> 适应期：正常次数范围留1~2次余力；核心可第5~6周起抱重物<br>
  <b>第6~8周</b> 弹力带版推进次数/阻力；3×15轻松余力超2→提前引入哑铃<br>
  <b>第9~12周</b> 哑铃版逐步替换：每2周换1~2个，顺序 侧平举→弯举→划船→卧推→深蹲<br>
  <b>第13~16周</b> 哑铃为主，弹力带只留面拉、夹胸<br><br>
  重量选择：薄肌目标选轻~中等重量，每组标准12~15次留1~2次余力即可。换哑铃后侧平举、划船刻意缩小幅度主动沉肩防斜方代偿。`},
 {t:"八 弹力带阻值分配（详细）",html:`
  你的规格：<b>5-15KG / 15-25KG</b> 两根<br><br>
  分配规则：<br>
  · 侧平举、面拉、夹胸、三头 → <b>5-15KG</b>（小肌群必须轻）<br>
  · 高位下拉、坐姿划船 → <b>15-25KG</b>（背阔是大肌群）<br>
  · 弯举 → 5-15KG起，体感轻再升15-25KG<br><br>
  20-25KG/30-50KG/45-60KG 不建议买：小肌群用大阻值容易耸肩代偿、伤肩；大肌群已有 15-25KG 加第 9 周起的哑铃路线，大阻值弹力带买来基本闲置。不是怕「练厚」——肌肉大小取决于刺激+总量+热量+时间。`}
];

/* ================= 引体专项四档（最新 Pull 日方案 A） ================= */
const PULLUP_TIERS=[
 {key:"start",label:"起步档",sub:"两根带·正手",
  full:"起步档｜两根弹力带（15-25KG 重带 + 5-15KG 轻带）· 正手（掌心朝前、与肩同宽）· 腋下背部辅助",
  sets:"周一 3 组 × 3~6 次｜周五 3 组 × 3~6 次｜休 90~120 秒",
  steps:["两根带从背后腋下穿过（不套手、不套脚），借力上拉","下巴过杆停顿 0.5 秒","慢放 2~3 秒"],
  tip:"你当前档位：已能正手 3 组 × 3 次，从 3 次起步，质量稳了再往 4→5→6 次爬。"},
 {key:"t1",label:"第一档",sub:"单根重带·正手",
  full:"第一档｜15-25KG 重带（单根）· 正手 · 腋下背部辅助",
  sets:"周一 3 组 × 3~6 次｜周五 3 组 × 3~6 次｜休 90~120 秒",
  steps:["单根重带从背后腋下穿过，借力上拉","下巴过杆停顿 0.5 秒","慢放 2~3 秒"],
  tip:"减掉一根带后次数掉到 3~5 次正常，从低次数重新起步。"},
 {key:"t2",label:"第二档",sub:"单根轻带·正手",
  full:"第二档｜5-15KG 轻带（单根）· 正手 · 腋下背部辅助",
  sets:"周一 3 组 × 3~6 次｜周五 3 组 × 3~6 次｜休 90~120 秒",
  steps:["单根轻带从背后腋下穿过，借力上拉","下巴过杆停顿 0.5 秒","慢放 2~3 秒"],
  tip:"辅助越来越小，动作标准优先，宁可少做也不要借力摆动。"},
 {key:"t3",label:"第三档",sub:"无辅助·正手",
  full:"第三档｜无辅助正手（里程碑：第 1 个无辅助引体）",
  sets:"先冲第 1 个完整引体；成功后周一 3 组 × 1~3 次｜周五 3 组 × 1~3 次｜休 90~120 秒",
  steps:["先冲第 1 个完整无辅助引体（里程碑，不固定测试，偶尔试一次）","成功后按周一 3 组、周五 3 组执行正式引体","加弹力带补容量 2 组 × 5~8 次（15-25KG 或 5-15KG 视体感）"],
  tip:"总次数在恢复良好的前提下逐步增加，不强制每周加固定数量。无辅助稳定 3 组 × 5 次后，高位下拉彻底删除。"}
];
const PULLUP_RULES=[
 "换档条件（起步档~第三档通用）：3 组全部高质量、每组至少 6 次、全程无摆动、下巴稳定过杆、下降控制 2 秒左右、最后一组仍留 1~2 次余力；三组必须都达标，第三组靠蹬腿摆动完成的不算。换档后次数掉到 3~5 次正常。",
 "弹力带推荐腋下背部辅助（带子从背后腋下穿过），不套手、不套脚；套膝盖仅作备选。",
 "单杠安全：免打孔门框单杠承受的是体重加动态拉力，第一次上杆先悬垂测试稳定性，再轻微负重，再正式辅助引体；单杠不稳就先不练。",
 "红线：全程沉肩不耸肩。降级信号只有肩关节疼痛、肘关节疼痛、前臂明显疲劳影响握杆、肩胛控制明显下降；普通肌肉酸痛照常练。",
 "第一个无辅助引体是里程碑，不固定测试，辅助引体做扎实后偶尔试一次。",
 "恢复出问题时减量顺序：先砍高位下拉 → 再减反向划船 3 到 2 组 → 引体最后动。",
 "无辅助引体稳定 3 组 × 5 次后，高位下拉彻底删除，Pull 日变为：引体 → 超人式（可选）→ 反向划船 → 面拉 → 弯举。"
];
function getPullupTier(){return localStorage.getItem("fit_pullup_tier")||"start"}
function setPullupTier(k){
  if(!PULLUP_TIERS.some(t=>t.key===k))k="start";
  localStorage.setItem("fit_pullup_tier",k);
  const sy=window.scrollY;renderDay();window.scrollTo(0,sy);
}
function getPullupEx(){
  const k=getPullupTier();
  const t=PULLUP_TIERS.find(x=>x.key===k)||PULLUP_TIERS[0];
  return {name:`引体专项｜${t.label}（${t.sub}）`,sets:t.sets,part:["背阔肌","大圆肌","肱二头肌","握力"],steps:t.steps,tip:t.tip};
}
function renderPullupGuide(){
  const tier=getPullupTier();
  return `<div style="margin:2px 0 12px">
   <div style="font-size:12px;color:var(--muted);margin-bottom:6px">🎚️ 选择你的当前引体档位（下方卡片同步显示对应组数与做法，选择会自动记住）</div>
   <div class="pullup-bar">${PULLUP_TIERS.map(t=>`<button class="pullup-btn ${t.key===tier?'active':''}" onclick="setPullupTier('${t.key}')">${t.label} ${t.sub}</button>`).join("")}</div>
   <details class="info"><summary>📖 引体专项四档 · 换档条件 · 红线</summary><div class="info-body">
   ${PULLUP_TIERS.map(t=>`<b>${t.full}</b><br>${t.sets}<br><br>`).join("")}
   ${PULLUP_RULES.map(r=>`· ${r}<br>`).join("")}
   </div></details>
  </div>`;
}
function renderUpSummary(up){
  if(!up)return "";
  if(up.text)return `<div class="up-summary">🔁 升级：${up.text.length>44?up.text.slice(0,44)+"…":up.text}</div>`;
  return `<div class="up-summary">🔁 升级后：${up.name}（${up.phase||""}）｜⚖️ ${up.first||""}</div>`;
}
function renderUpBlock(up){
  if(!up)return "";
  if(up.text)return `<div class="up-box"><div class="up-title">🔁 升级方式</div><div class="up-note">${up.text}</div></div>`;
  return `<div class="up-box">
    <div class="up-title">🔁 升级后：${up.name} <span class="up-phase">（${up.phase||""}）</span></div>
    ${up.sets?`<div class="ex-meta" style="margin-top:2px">${up.sets}</div>`:""}
    <div style="margin:5px 0 8px">${(up.part||[]).map(p=>`<span class="badge db">${p}</span>`).join("")}<span class="badge db">🏋️ 哑铃版</span></div>
    ${up.steps?up.steps.map((s,j)=>`<div class="step"><b>第${j+1}步</b><span>${s}</span></div>`).join(""):""}
    ${up.chain?`<div class="up-note">🔗 ${up.chain}</div>`:""}
    ${up.first?`<div class="up-note">⚖️ ${up.first}</div>`:""}
    ${up.prog?`<div class="up-note">📈 ${up.prog}</div>`:""}
    ${up.note?`<div class="up-note">💡 ${up.note}</div>`:""}
  </div>`;
}

/* ================= 渲染 ================= */
let curWeek=parseInt(localStorage.getItem("fit_week")||"4");
let curDay=parseInt(localStorage.getItem("fit_next_day")||"0");
   if(curDay<0||curDay>6)curDay=0;
if(curWeek<4||curWeek>16)curWeek=4;
function doneKey(d,i){return `fit_w${curWeek}_d${d}_i${i}`}
function dateKey(d){return `fit_date_w${curWeek}_d${d}`}
   function getDateStr(d){return localStorage.getItem(dateKey(d))||""}
   function setDateStr(d,s){
     if(s)localStorage.setItem(dateKey(d),s);
     else localStorage.removeItem(dateKey(d));
   }
   function todayStr(){
     const n=new Date();
     return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
   }
function getDone(k){return localStorage.getItem(k)==="1"}
function setDone(k,v){v?localStorage.setItem(k,"1"):localStorage.removeItem(k)}
function resolveEx(ex){return ex}
function updateProgress(){
  let total=0,done=0;
  DAYS.forEach((day,d)=>{
    if(day.rest)return;
    const list=day.getList().filter(x=>!x.sec);
    total+=list.length;
    list.forEach((_,i)=>{if(getDone(doneKey(d,i)))done++});
  });
  const pct=total?Math.round(done/total*100):0;
  document.getElementById("pfill").style.width=pct+"%";
  document.getElementById("plabel").textContent=`第 ${curWeek} 周 · 本周总进度：${done} / ${total} 个动作（${pct}%）`;
}
function renderWeekBar(){
  document.getElementById("weekBar").innerHTML=
    Array.from({length:13},(_,i)=>i+4).map(w=>
      `<button class="wk-btn ${w===curWeek?'active':''}" onclick="setWeek(${w})">第${w}周</button>`).join("");
}
function renderInfo(){
  document.getElementById("infoWrap").innerHTML=INFO_SECTIONS.map(s=>
    `<details class="info"><summary>${s.t}</summary><div class="info-body">${s.html}</div></details>`).join("");
}
function renderDay(){
  updateProgress();
  const day=DAYS[curDay],ph=phaseInfo(curWeek);
  document.getElementById("dayBar").innerHTML=DAYS.map((d,i)=>
    `<button class="day-btn ${i===curDay?'active':''} ${d.rest?'rest-day':''}" onclick="setDay(${i})">${d.label}${d.rest?' 🛌':''}</button>`).join("");
  const savedDate=getDateStr(curDay);
   let html=`<div class="day-title"><h2>${day.label} · ${day.name}</h2><span>${day.focus}</span><span class="phase-tag">${ph.tag}</span><div style="color:var(--muted);font-size:12.5px;margin-top:8px">${ph.desc}</div></div>
   ${!day.rest?`<div class="date-row">
     <span>📅 训练日期：</span>
     <input type="date" id="trainDate" value="${savedDate}" onchange="setDateStr(curDay,this.value)">
     <button class="clear-btn" onclick="clearTrainDate()">清空</button>
   </div>`:``}`;
  let idx=0;
  for(const raw of day.getList()){
    if(raw.sec){html+=`<div class="section-label">— ${raw.sec} —</div>`;continue;}
    if(raw.pullup)html+=renderPullupGuide();
    const ex=raw.pullup?getPullupEx():resolveEx(raw);
    const isDone=getDone(doneKey(curDay,idx));
    html+=`<section class="exercise ${isDone?'done':''}" id="ex${idx}">
      <div class="ex-head" onclick="toggleBody(${idx})">
        <span class="done-toggle" onclick="event.stopPropagation();markDone(${idx})">✓</span>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          ${ex.sets?`<div class="ex-meta">${ex.sets}</div>`:""}
          <div>${(ex.part||[]).map(p=>`<span class="badge">${p}</span>`).join("")}</div>
          ${renderUpSummary(ex.up)}
        </div>
      </div>`;
    if(ex.steps&&ex.steps.length){
      html+=`<div class="ex-body"><div class="steps">
        <div class="target-muscle">🎯 目标肌肉：${ex.part.join(" · ")}</div>
        ${ex.steps.map((s,j)=>`<div class="step"><b>第${j+1}步</b><span>${s}</span></div>`).join("")}
        ${ex.tip?`<div class="tip">💡 ${ex.tip}</div>`:""}
        ${(()=>{const v=findVideo(ex.name);return v?`<video src="videos/${v}.mp4" controls muted playsinline style="width:100%;max-width:360px;border-radius:10px;margin-top:12px;display:block" preload="none"></video>`:""})()}
        ${renderUpBlock(ex.up)}
      </div></div>`;
    }
    html+=`</section>`;idx++;
  }
  document.getElementById("main").innerHTML=html;
}
function clearTrainDate(){setDateStr(curDay,null);renderDay();}
   function markAllToday(){
    const day=DAYS[curDay];
    if(day.rest){alert("今天是休息日，不需要打卡");return;}
    const list=day.getList().filter(x=>!x.sec);
    list.forEach((_,i)=>setDone(doneKey(curDay,i),"1"));
    if(!getDateStr(curDay))setDateStr(curDay,todayStr());
    renderDay();
  }
   function isDayCompleted(d){
     if(DAYS[d].rest)return true;
     const list=DAYS[d].getList().filter(x=>!x.sec);
     return list.every((_,i)=>getDone(doneKey(d,i)));
   }
   // On load: if current day already completed (all items done), advance to next uncompleted training day
   // This handles: user trained Wed, Thu was rest, Fri opens -> auto-jump to next uncompleted training day
   // Also handles: week transition - if all days in current week completed, move to next week's first training day
   (function(){
     let guard=0;
     while(guard<14){
       if(!isDayCompleted(curDay))break; // not yet done, stay here
       // current day is fully completed -> find next uncompleted non-rest day
       let nd=curDay,found=false;
       for(let k=0;k<7;k++){
         nd=(nd+1)%7;
         if(DAYS[nd].rest)continue;
         if(!isDayCompleted(nd)){curDay=nd;localStorage.setItem("fit_next_day",nd);found=true;break;}
       }
       if(!found){
         // all days in this week completed -> advance to next week, reset curDay to 0
         const nw=curWeek+1;
         if(nw>16){break;} // past max week
         curWeek=nw;
         localStorage.setItem("fit_week",nw);
         curDay=0;
         localStorage.setItem("fit_next_day",0);
         break;
       }
       guard++;
     }
   })();
   function toggleBody(i){document.getElementById("ex"+i).querySelector(".ex-body").classList.toggle("open")}
function markDone(i){
     const wasCompleted=isDayCompleted(curDay);
     setDone(doneKey(curDay,i),!getDone(doneKey(curDay,i)));
     // If this is the first check (no date yet) and we just checked something, record today's date
     if(!getDateStr(curDay)&&getDone(doneKey(curDay,i)))setDateStr(curDay,todayStr());
     // If all items just got unchecked, clear the date
     if(wasCompleted&&!isDayCompleted(curDay))setDateStr(curDay,null);
     const sy=window.scrollY;
     renderDay();
     window.scrollTo(0,sy);
   }
function setDay(i){curDay=i;renderDay()}
function setWeek(w){curWeek=w;localStorage.setItem("fit_week",w);renderWeekBar();renderDay()}

document.getElementById("today").textContent=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
renderWeekBar();
renderInfo();
renderDay();

</script>
